<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation • Almaty</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0f;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(120, 80, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 80, 120, 0.1) 0%, transparent 40%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #f3f4f6;
        }

        .card {
            background: rgba(22, 22, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 36px 28px;
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 440px;
            width: 90%;
            position: relative;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            min-height: 250px;
        }

        .scrollable-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
            margin-bottom: 10px;
        }

        .scrollable-list::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .btn {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .btn span {
            font-size: 11px;
            color: #9ca3af;
            font-weight: 400;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .btn-option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 13px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-escape {
            background: transparent;
            color: #6b7280;
            border: 1.5px dashed rgba(255, 255, 255, 0.1);
            position: absolute;
            bottom: 0;
            left: 0;
            text-align: center;
            display: block;
        }
        .btn-escape:hover {
            color: #9ca3af;
        }

        .step-content {
            display: none;
            text-align: left;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: rgba(120, 80, 255, 0.6);
        }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-submit {
            background: #25D366;
            color: #ffffff;
            font-weight: 600;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 5px;
        }

        .btn-submit:hover {
            background: #22bf5b;
            transform: translateY(-1px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ШАГ 1: Главное меню -->
        <div id="step1">
            <div class="badge">Алматы • Октябрь</div>
            <h1>Куда отправимся?</h1>
            <p>Выбери направление на вечер.</p>
            
            <div class="buttons" id="btnContainer">
                <button class="btn btn-option" onclick="showSubMenu('coffee')">
                    ☕️ Атмосферные кофейни
                    <span>Bowler, Jump, Nedelka, Paul и др.</span>
                </button>
                <button class="btn btn-option" onclick="showSubMenu('anticafe')">
                    🎲 Антикафе и пространства
                    <span>Некафе, Как дома, MyRoom, VIP-кинорумы</span>
                </button>
                <button class="btn btn-option" onclick="showSubMenu('cinema')">
                    🎬 Кинотеатры Алматы
                    <span>Esentai, Dostyk Plaza, Mega, Sary-Arka</span>
                </button>
                <button class="btn btn-escape" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Никуда 🙄</button>
            </div>
        </div>

        <!-- ШАГ 2: Подменю (выбор конкретного места) -->
        <div id="step2" class="step-content">
            <button class="btn-back" onclick="goBackToCategories()">← Назад к категориям</button>
            <div class="badge" id="subCategoryTitle">Выбор</div>
            <h1>Выбери локацию</h1>
            <p id="subCategoryDesc">Лучшие точки города.</p>
            
            <div class="scrollable-list" id="subButtonsContainer">
                <!-- Сюда подгружаются элементы -->
            </div>
        </div>

        <!-- ШАГ 3: Выбор даты и времени -->
        <div id="step3" class="step-content">
            <button class="btn-back" onclick="goBackToSubMenu()">← Назад к выбору</button>
            <div class="badge" id="selectedBadgeName">Выбор сделан</div>
            <h1>Когда тебе удобно?</h1>
            <p>Выбери день и время, и бронь прилетит мне в WhatsApp.</p>
            
            <div class="form-group">
                <label>Дата встречи</label>
                <input type="date" id="dateInput" class="form-control">
            </div>

            <div class="form-group">
                <label>Время</label>
                <input type="time" id="timeInput" class="form-control" value="18:00">
            </div>

            <button class="btn-submit" onclick="sendToWhatsApp()">Отправить бронь в WhatsApp 🟢</button>
        </div>
    </div>

    <script>
        let selectedCategory = '';
        let chosenLocation = '';

        // Проверенная база реальных локаций Алматы
        const categoriesData = {
            coffee: {
                title: 'Кофейни в Алматы',
                desc: 'Уютные места для долгих разговоров и десертов',
                items: [
                    { name: '☕️ Bowler Coffee (ул. Панфилова)', desc: 'Стильно, атмосферно, центр города' },
                    { name: '☕️ Jump Coffee (в центре)', desc: 'Уютно, отличный выбор напитков' },
                    { name: '☕️ Nedelka (пр. Абая / Фурманова)', desc: 'Классика для встреч с потрясающим видом' },
                    { name: '☕️ Paul (Dostyk Plaza / Esentai)', desc: 'Французская эстетика и круассаны' },
                    { name: '☕️ Mad Coffee (ул. Гоголя)', desc: 'Молодежное и оживленное место' }
                ]
            },
            anticafe: {
                title: 'Антикафе и пространства',
                desc: 'Тепло, игры, приставки и приватность',
                items: [
                    { name: '🎲 Некафе (на Маркова / Тимирязева)', desc: 'Настолки, приставки, чай и сладости' },
                    { name: '🎲 Антикафе "Как дома" (ул. Байзакова)', desc: 'Уютная атмосфера, приставки, аэрохоккей' },
                    { name: '🎲 Антикафе MyRoom (пр. Гагарина)', desc: 'Настольные игры, приставки, уединение' },
                    { name: '🎬 VIP Кинорум / Частный зал', desc: 'Отдельная комната, фильмы, диваны и PS5' }
                ]
            },
            cinema: {
                title: 'Кинотеатры Алматы',
                desc: 'Премьеры, большой экран и попкорн',
                items: [
                    { name: '🍿 Kinopark 11 IMAX (Esentai Mall)', desc: 'Премиум-зал, огромный экран и комфорт' },
                    { name: '🍿 Cinemax (Dostyk Plaza)', desc: 'Отличный звук Dolby Atmos, удобство' },
                    { name: '🍿 Chaplin (ТРЦ Mega Alma-Ata)', desc: 'Залы с премиум-местами и 4DX' },
                    { name: '🍿 Chaplin (ТРЦ Mega Park)', desc: 'Современный кинотеатр в центре' },
                    { name: '🍿 Kinoplexx (ТРЦ Sary-Arka)', desc: 'Бюджетно, удобно и классический выбор' }
                ]
            }
        };

        function moveButton() {
            const btn = document.getElementById('noBtn');
            const container = document.getElementById('btnContainer');
            
            const maxX = container.clientWidth - btn.clientWidth;
            const maxY = 180;
            
            const randomX = Math.floor(Math.random() * Math.max(0, maxX));
            const randomY = Math.floor(Math.random() * Math.max(0, maxY));
            
            btn.style.left = randomX + 'px';
            btn.style.bottom = randomY + 'px';
        }

        function showSubMenu(categoryKey) {
            selectedCategory = categoryKey;
            const catData = categoriesData[categoryKey];

            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('subCategoryTitle').innerText = catData.title;
            document.getElementById('subCategoryDesc').innerText = catData.desc;

            const container = document.getElementById('subButtonsContainer');
            container.innerHTML = '';

            catData.items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-option';
                btn.innerHTML = `${item.name}<span>${item.desc}</span>`;
                btn.onclick = () => selectLocation(item.name);
                container.appendChild(btn);
            });
        }

        function selectLocation(locationName) {
            chosenLocation = locationName;
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
            document.getElementById('selectedBadgeName').innerText = locationName;
        }

        function goBackToCategories() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
        }

        function goBackToSubMenu() {
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        function sendToWhatsApp() {
            const date = document.getElementById('dateInput').value;
            const time = document.getElementById('timeInput').value;

            if (!date) {
                alert('Пожалуйста, выбери дату свидания!');
                return;
            }

            const myPhoneNumber = '77789249246'; 
            const text = encodeURIComponent(`Привет! Я выбрала свидание ❤️\n\n📍 Локация: ${chosenLocation}\n📅 Дата: ${date}\n⏰ Время: ${time}`);
            
            window.location.href = `https://wa.me/${myPhoneNumber}?text=${text}`;
        }
    </script>

</body>
                    </html>
